# TaskFlow – Nginx (guide section 13.3). Replace taskflow.com with your domain.
# Certificates: sudo certbot --nginx -d app.taskflow.com -d api.taskflow.com
# Adjust the PHP-FPM socket to your PHP version.
#
# NOTE: add_header inside a `location` block DROPS server-level add_header lines for that block.
# That is why the static-assets location below repeats the security headers via an include.

limit_req_zone $binary_remote_addr zone=api_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=10r/m;

# ---------- shared snippets (copy to /etc/nginx/snippets/ or keep inline) ----------
# snippets/taskflow-tls.conf
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
#   ssl_session_tickets off;
#   ssl_stapling on;
#   ssl_stapling_verify on;

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name app.taskflow.com api.taskflow.com;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.taskflow.com;

    ssl_certificate     /etc/letsencrypt/live/api.taskflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taskflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/taskflow/taskflow-api/public;   # only public/ is ever web-visible
    index index.php;
    client_max_body_size 1m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=api_global burst=40 nodelay;

    # Extra brake on credential endpoints (Laravel also throttles per account+IP)
    location ~ ^/api/(login|register|forgot-password|reset-password)$ {
        limit_req zone=api_auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param X-Forwarded-Proto https;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }            # blocks .env, .git
    location ~* \.(sql|bak|log|ini|sh|md)$ { deny all; }  # never serve backups or config
}

# ---------- Frontend (React build) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.taskflow.com;

    ssl_certificate     /etc/letsencrypt/live/app.taskflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.taskflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/taskflow-web;
    index index.html;
    server_tokens off;

    # Frontend CSP (guide 9.7 / 13.3): scripts and styles only from our own origin;
    # API calls only to the API origin; no framing; no <base> or form hijacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.taskflow.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri /index.html;      # React Router support
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/taskflow-headers.conf;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/taskflow-headers.conf;  # location add_header drops server-level ones
    }
    location ~ /\.(?!well-known) { deny all; }
}

