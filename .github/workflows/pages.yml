name: GitHub Pages (demo)

# Publishes the React frontend as a static demo on GitHub Pages.
# GitHub cannot run PHP/MySQL, so this build uses the in-browser demo API (VITE_USE_MOCK=true):
# data lives in each visitor's own browser. The real Laravel API is deployed separately (deploy.yml).
#
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['taskflow-web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: taskflow-web/package-lock.json }
      - name: Build
        working-directory: taskflow-web
        env:
          VITE_USE_MOCK: 'true'
          VITE_API_URL: ''
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run lint
          npm test -- --run      # includes the click-through test of the demo
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback: deep links like /tasks/3 load the app
      - uses: actions/upload-pages-artifact@v3
        with: { path: taskflow-web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
